name: Build TV APK

# TV v1: simple patched-build pipeline for this fork.
# The upstream android-release.yml refuses to build when app files changed
# after the last version bump, and needs upstream-only signing secrets.
# This workflow just compiles the Full release APK and uploads it as an
# artifact, signed with the standard Android debug certificate (via the
# app's legacy update-compat signing path), so it can be sideloaded on a TV.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Full Release APK (TV)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure debug keystore exists for legacy signing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create local.properties for build config
        run: |
          # generateRuntimeConfigs requires this file to exist. The build
          # script has public Supabase defaults baked in, so an (almost)
          # empty file is enough; Trakt/Telegram keys stay empty here.
          : > local.properties
          if [ -n "${ANDROID_HOME}" ]; then
            printf 'sdk.dir=%s\n' "${ANDROID_HOME}" >> local.properties
          fi

      - name: Build Full Release APK
        # TV builds skip R8 minification: two runs in a row were killed by a
        # runner shutdown during minifyFullReleaseWithR8, and skipping it also
        # avoids R8 breaking the reflection-heavy CloudStream runtime. The app
        # honours this switch itself (nuvio.android.minify gradle property).
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.minify=false --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-enhanced-tv-apk
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
